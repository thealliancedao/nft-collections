# import-from-tla-core — ONE-TIME move of the nft-flows outputs that were first built inside tla-core into their
# collections' own folders here. Copies via raw.githubusercontent (tla-core is public), commits, never deletes anything
# in tla-core (purge there is the owner's step, listed in the run summary). Re-run safe: identical files are no-ops.
name: import-from-tla-core
on:
  workflow_dispatch:
    inputs:
      what: { description: 'all | ledgers | raw | fcd', required: false, default: 'all' }
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: import
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHAT: ${{ inputs.what }}
        run: node .github/scripts/nft-flows/import-from-tla-core.js
      - name: commit
        run: |
          git config user.name "import-from-tla-core" && git config user.email "bot@thealliancedao.com"
          git add -A pixel-lions tla-locks adao
          if git diff --cached --quiet; then echo "nothing to import"; exit 0; fi
          git commit -m "import nft-flows outputs from tla-core ($(date -u +%Y-%m-%dT%H:%M)Z)"
          for i in 1 2 3 4 5 6; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i * 15)); done; exit 1
