# nft-flows-derive — ONE-TIME rebuild: every archive in a collection's folder → <collection>/ledger/ (month files,
# primary-sales with USD at the day, lineage for locks, index with coverage + honest gaps). Idempotent. Forward capture
# is the Render cron org-nft-flows-<collection>; this only re-derives history (after a harvest, a walk, or a classifier change).
name: nft-flows-derive
on:
  workflow_dispatch:
    inputs:
      collections:
        description: 'collection (all = every folder with a capture block)'
        type: choice
        default: all
        options: [all, adao, pixel-lions, tla-locks]
permissions:
  contents: write
concurrency:
  group: nft-flows-derive
  cancel-in-progress: false
jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # derive 1.1 (2026-09-19): USD at the day from THE org price oracle through the cron's own pricing rule — two run-time
      # checkouts, nothing copied into this repo: platform-crons (nfts/nft-flows/lib/oracle-usd.js + lib/denom-symbol.js) and
      # a sparse tla-core (price-history months + the token-catalog snapshot). The deleted luna-usd-daily.json is gone.
      - name: platform-crons (the pricing rule, required at run time)
        uses: actions/checkout@v4
        with:
          repository: thealliancedao/platform-crons
          path: _crons
      - name: tla-core (price-history + token-catalog, sparse)
        uses: actions/checkout@v4
        with:
          repository: thealliancedao/tla-core
          path: _core
          sparse-checkout: |
            price-history
            token-catalog/snapshots
      - name: gate + derive
        env:
          COLLECTIONS: ${{ inputs.collections }}
          CRONS_DIR: ${{ github.workspace }}/_crons
          TLA_CORE_DIR: ${{ github.workspace }}/_core
        run: |
          node .github/scripts/nft-flows/gate-classify.mjs .
          node .github/scripts/nft-flows/derive.js
      - name: commit (pull --rebase + retry)
        run: |
          git config user.name "nft-flows-derive" && git config user.email "bot@thealliancedao.com"
          git add */ledger
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "nft-flows derive $(date -u +%Y-%m-%dT%H:%M)Z"
          for i in 1 2 3 4 5 6; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i * 15)); done; exit 1
