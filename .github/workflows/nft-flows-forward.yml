# nft-flows-forward — ONE-TIME fill (dispatch only, never scheduled): walks a collection from the last height its own
# archives cover → chain head on a public RPC, then derives. Run it once after a backfill so the Render cron
# (org-nft-flows-<slug>) starts from today instead of walking months. Scheduled capture is a Render job by doctrine.
name: nft-flows-forward
on:
  workflow_dispatch:
    inputs:
      collections:
        description: 'collection (all = every folder with a capture block)'
        type: choice
        default: all
        options: [all, adao, pixel-lions, tla-locks]
      node:
        description: 'public node — this fill covers the rolling window only; older spans need nft-flows-walk on the archive'
        type: choice
        default: public publicnode
        options: [public publicnode, public polkachu]
permissions:
  contents: write
concurrency:
  group: nft-flows-forward
  cancel-in-progress: false
jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # derive 1.1 (2026-09-19): USD at the day from THE org price oracle through the cron's own pricing rule — two run-time
      # checkouts, nothing copied into this repo: platform-crons (nfts/nft-flows/lib/oracle-usd.js + lib/denom-symbol.js) and
      # a sparse tla-core (price-history months + the token-catalog snapshot). The deleted luna-usd-daily.json is gone.
      - name: platform-crons (the pricing rule, required at run time)
        uses: actions/checkout@v4
        with:
          repository: thealliancedao/platform-crons
          path: _crons
      - name: tla-core (price-history + token-catalog, sparse)
        uses: actions/checkout@v4
        with:
          repository: thealliancedao/tla-core
          path: _core
          sparse-checkout: |
            price-history
            token-catalog/snapshots
      - name: walk each collection to head (raw parts land on main via the API)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          RPC_URL: ${{ inputs.node == 'public polkachu' && 'https://terra-rpc.polkachu.com' || 'https://terra-rpc.publicnode.com' }}
          COLLECTIONS: ${{ inputs.collections }}
          PACE_MS: '250'
        run: node .github/scripts/nft-flows/forward.js
      - name: pull the parts this run just wrote
        run: git pull --rebase origin main
      - name: gate + derive
        env:
          CRONS_DIR: ${{ github.workspace }}/_crons
          TLA_CORE_DIR: ${{ github.workspace }}/_core
        run: |
          node .github/scripts/nft-flows/gate-classify.mjs .
          node .github/scripts/nft-flows/derive.js
      - name: commit (pull --rebase + retry)
        run: |
          git config user.name "nft-flows-forward" && git config user.email "bot@thealliancedao.com"
          git add */ledger _shared/forward-summary.json
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "nft-flows forward $(date -u +%Y-%m-%dT%H:%M)Z"
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin HEAD:main && echo "pushed on try $i" && exit 0
            echo "push try $i lost the race — retrying"; sleep $((i * 15))
          done
          exit 1
