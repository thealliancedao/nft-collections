# nft-flows-walk — ONE-TIME: fill a collection's ledger window. Defaults do the obvious thing: from = the last height
# the collection's archives cover, to = the node head, chaining chunks until it gets there. Give heights only for a
# specific span (e.g. the FCD-freeze day). Archive node by default (blank rpc_url); anything within the public node's
# rolling window can use a public rpc_url. Then run nft-flows-derive.
name: nft-flows-walk
on:
  workflow_dispatch:
    inputs:
      collection:
        description: 'collection'
        type: choice
        default: pixel-lions
        options: [adao, pixel-lions, tla-locks]
      from_height: { description: 'blank = resume from the last covered height', required: false, default: '' }
      final_height: { description: 'blank = the node head (chains chunks until reached)', required: false, default: '' }
      to_height: { description: 'single-chunk end (for a specific span, e.g. the freeze day)', required: false, default: '' }
      node:
        description: 'node — archive = ARCHIVE_RPC secret, paced, precious (pruned span < ~2.5 months old); public = free rolling window only'
        type: choice
        default: archive
        options: [archive (secret · paced · needed for anything older than the public window), public publicnode (free · recent blocks only), public polkachu (free · recent blocks only)]
      pace_ms: { description: 'sleep after every node call (ms)', required: false, default: '250' }
      chunk_blocks: { description: 'blocks per run', required: false, default: '300000' }
permissions:
  contents: write
  actions: write
concurrency:
  group: nft-flows-walk-${{ inputs.collection }}
  cancel-in-progress: false
jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            venues.json
            ${{ inputs.collection }}/collection.json
            ${{ inputs.collection }}/ledger/index.json
            ${{ inputs.collection }}/raw
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: platform-crons (tx-body.js — message bodies decoded by the cron's own decoder, walk 1.1)
        uses: actions/checkout@v4
        with:
          repository: thealliancedao/platform-crons
          path: _crons
          sparse-checkout: |
            nfts/nft-flows/lib
      - name: walk
        env:
          CRONS_DIR: ${{ github.workspace }}/_crons
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          ARCHIVE_RPC: ${{ startsWith(inputs.node, 'archive') && secrets.ARCHIVE_RPC || '' }}
          NODE_CHOICE: ${{ inputs.node }}
          RPC_URL: ${{ startsWith(inputs.node, 'public publicnode') && 'https://terra-rpc.publicnode.com' || startsWith(inputs.node, 'public polkachu') && 'https://terra-rpc.polkachu.com' || '' }}
          COLLECTION: ${{ inputs.collection }}
          WALK_FROM: ${{ inputs.from_height }}
          WALK_TO: ${{ inputs.to_height }}
          FINAL_HEIGHT: ${{ inputs.final_height }}
          PACE_MS: ${{ inputs.pace_ms }}
          CHUNK_BLOCKS: ${{ inputs.chunk_blocks }}
        run: node .github/scripts/nft-flows/walk.js
