# nft-flows-walk — ONE-TIME: walk one collection's watch set over a height span (archive node for the pruned span
# 13,737,811→21,481,530; a public rpc_url for anything in retention) → write-once raw parts under <collection>/raw/.
# Self-chaining: dispatch once with from_height + final_height. Then run nft-flows-derive.
name: nft-flows-walk
on:
  workflow_dispatch:
    inputs:
      collection: { description: 'collection slug (folder)', required: true, default: 'pixel-lions' }
      from_height: { description: 'walk FROM (inclusive)', required: true }
      final_height: { description: 'self-chain until (inclusive); blank = single chunk', required: false, default: '' }
      to_height: { description: 'single-chunk override', required: false, default: '' }
      rpc_url: { description: 'public RPC (blank = ARCHIVE_RPC secret)', required: false, default: '' }
      pace_ms: { description: 'sleep after every node call (ms)', required: false, default: '250' }
      chunk_blocks: { description: 'blocks per run', required: false, default: '300000' }
permissions:
  contents: write
  actions: write
concurrency:
  group: nft-flows-walk-${{ inputs.collection }}
  cancel-in-progress: false
jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            venues.json
            ${{ inputs.collection }}/collection.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: walk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          ARCHIVE_RPC: ${{ inputs.rpc_url == '' && secrets.ARCHIVE_RPC || '' }}
          RPC_URL: ${{ inputs.rpc_url }}
          COLLECTION: ${{ inputs.collection }}
          WALK_FROM: ${{ inputs.from_height }}
          WALK_TO: ${{ inputs.to_height }}
          FINAL_HEIGHT: ${{ inputs.final_height }}
          PACE_MS: ${{ inputs.pace_ms }}
          CHUNK_BLOCKS: ${{ inputs.chunk_blocks }}
        run: node .github/scripts/nft-flows/walk.js
