# nft-flows-walk — ONE-TIME: fill a collection's ledger window. Defaults do the obvious thing: from = the last height
# the collection's archives cover, to = the node head, chaining chunks until it gets there. Give heights only for a
# specific span (e.g. the FCD-freeze day). Archive node by default (blank rpc_url); anything within the public node's
# rolling window can use a public rpc_url. Then run nft-flows-derive.
name: nft-flows-walk
on:
  workflow_dispatch:
    inputs:
      collection: { description: 'collection slug (folder)', required: true, default: 'pixel-lions' }
      from_height: { description: 'blank = resume from the last covered height', required: false, default: '' }
      final_height: { description: 'blank = the node head (chains chunks until reached)', required: false, default: '' }
      to_height: { description: 'single-chunk end (for a specific span, e.g. the freeze day)', required: false, default: '' }
      rpc_url: { description: 'public RPC (blank = ARCHIVE_RPC secret)', required: false, default: '' }
      pace_ms: { description: 'sleep after every node call (ms)', required: false, default: '250' }
      chunk_blocks: { description: 'blocks per run', required: false, default: '300000' }
permissions:
  contents: write
  actions: write
concurrency:
  group: nft-flows-walk-${{ inputs.collection }}
  cancel-in-progress: false
jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            venues.json
            ${{ inputs.collection }}/collection.json
            ${{ inputs.collection }}/ledger/index.json
            ${{ inputs.collection }}/raw
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: walk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          ARCHIVE_RPC: ${{ inputs.rpc_url == '' && secrets.ARCHIVE_RPC || '' }}
          RPC_URL: ${{ inputs.rpc_url }}
          COLLECTION: ${{ inputs.collection }}
          WALK_FROM: ${{ inputs.from_height }}
          WALK_TO: ${{ inputs.to_height }}
          FINAL_HEIGHT: ${{ inputs.final_height }}
          PACE_MS: ${{ inputs.pace_ms }}
          CHUNK_BLOCKS: ${{ inputs.chunk_blocks }}
        run: node .github/scripts/nft-flows/walk.js
